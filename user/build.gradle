// 인증·사용자 도메인.
// 다른 도메인 모듈(equipment, quality ...)을 의존하지 않는다. 필요해 보이면 경계가 잘못 그어진 것이다.
dependencies {
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 컨트롤러를 이 모듈이 소유한다. 도메인이 자기 엔드포인트를 갖는 편이
    // bootstrap 에 모든 컨트롤러를 모으는 것보다 경계가 선명하다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 요청 값 검증. 프론트에도 검증이 있지만 그건 UX 이지 방어가 아니다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // PasswordEncoder 타입만 필요하다. 빈 자체는 bootstrap 이 만든다.
    // 시큐리티 스타터 전체를 끌어오지 않으려고 crypto 만 쓴다.
    implementation 'org.springframework.security:spring-security-crypto'

    // jjwt 는 Boot BOM 이 관리하지 않는 유일한 의존성이라 버전을 직접 적는다.
    // 올릴 때 세 줄을 같이 올릴 것.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
}
