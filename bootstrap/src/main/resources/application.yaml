# 모든 환경 공통 설정. 환경별 값은 application-{프로필}.yaml 에 둔다.
# 공통 파일과 프로필 파일은 병합된다(프로필 쪽이 우선).
spring:
  application:
    name: company-backend

  profiles:
    # 프로필을 지정하지 않고 실행하면 local 이 켜진다. 운영값이 실수로 잡히는 일이 없도록.
    default: local

  jpa:
    # true(기본)면 응답을 다 내보낼 때까지 DB 커넥션을 물고 있어 풀이 먼저 마른다.
    open-in-view: false
    properties:
      hibernate:
        # Instant 를 DB에 쓸 때 기준 타임존. 지정하지 않으면 JVM 기본값을 따라가서
        # 로컬(KST)과 도커 배포(UTC)가 서로 다른 값을 쓰게 된다.
        jdbc:
          time_zone: UTC

app:
  jwt:
    # 액세스 토큰은 무효화할 방법이 없어서(서명만으로 검증) 수명으로 위험을 제한한다.
    # 프론트 목 데이터의 1800초와 맞춰둔 값이다.
    access-token-ttl: 30m
