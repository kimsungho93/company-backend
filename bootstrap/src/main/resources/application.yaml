# 모든 환경 공통 설정. 환경별 값은 application-{프로필}.yaml 에 둔다.
# 공통 파일과 프로필 파일은 병합된다(프로필 쪽이 우선).
spring:
  application:
    name: company-backend

  profiles:
    # 프로필을 지정하지 않고 실행하면 local 이 켜진다. 운영값이 실수로 잡히는 일이 없도록.
    default: local

  jpa:
    # true(기본)면 응답을 다 내보낼 때까지 DB 커넥션을 물고 있어 풀이 먼저 마른다.
    open-in-view: false
    properties:
      hibernate:
        # Instant 를 DB에 쓸 때 기준 타임존. 반드시 박아둘 것 - 비우면 JVM 기본값을
        # 따라가서 로컬(KST)과 컨테이너(UTC)가 같은 컬럼에 9시간 어긋난 값을 쓴다.
        #
        # 한국에서만 쓰는 시스템이라 UTC 가 아니라 KST 로 맞췄다. 로그·DB·화면이
        # 전부 같은 시각을 보여주는 쪽이 매일 이득이다. 대신 컨테이너 TZ 도 같이
        # 맞춰야 한다 - 한쪽만 바꾸면 로그와 DB 가 어긋나 지금보다 나빠진다.
        jdbc:
          time_zone: Asia/Seoul

app:
  jwt:
    # 액세스 토큰은 무효화할 방법이 없어서(서명만으로 검증) 수명으로 위험을 제한한다.
    # 프론트 목 데이터의 1800초와 맞춰둔 값이다.
    access-token-ttl: 30m

  # JWT 가 아니라 난수다. 어차피 DB 를 조회하므로 자체 검증이 필요 없고,
  # 폐기할 수 있으니 액세스 토큰보다 길게 잡아도 된다.
  refresh-token:
    ttl: 14d
