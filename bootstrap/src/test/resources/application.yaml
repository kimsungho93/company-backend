# datasource 는 여기 없다. TestcontainersConfiguration 의 @ServiceConnection 이 꽂아준다.
#
# 이 파일은 main 의 application.yaml 을 병합하지 않고 통째로 가린다.
# main 에만 프로퍼티를 추가하면 테스트에서 조용히 빠지므로 두 파일을 같이 볼 것.
spring:
  application:
    name: company-backend

  jpa:
    hibernate:
      # 컨테이너가 매번 새로 뜨지만, 한 실행 안에서도 깨끗하게 시작하도록 명시해둔다.
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        # 목록 조회가 사람 수만큼 쿼리를 내지 않는지 세기 위해 켠다.
        generate_statistics: true
        jdbc:
          time_zone: Asia/Seoul
        type:
          preferred_instant_jdbc_type: TIMESTAMP

# main 을 병합하지 않고 가리므로 여기에도 있어야 한다. 없으면 SecurityConfig 가
# 플레이스홀더를 못 풀어 컨텍스트 로딩이 실패한다.
app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-only-jwt-secret-value-at-least-32-bytes-long
    access-token-ttl: 30m
  refresh-token:
    ttl: 14d
    cookie-secure: false
